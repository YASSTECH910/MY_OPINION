<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Love Forever</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    /* --- Base page --- */
    body {
      background: #000;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }

/* --- Quick links (translated) --- */
.quick-link {
  position: fixed;
  right: 10px;
  width: 35px;
  height: 35px;
  z-index: 999;
  background: #696969;
  border-radius: 50%;
  padding: 1px;
  text-align: center;
  color: #ddd;
  text-decoration: none;
  line-height: 35px;
  font-size: 13px;
  user-select: none;
}
.quick-link:nth-of-type(1) { top: 10%; }  /* Create */
.quick-link:nth-of-type(2) { top: 4%;  z-index: 998; }  /* More */
.quick-link:nth-of-type(3) { top: 16%; z-index: 997; }  /* Source Code */
.quick-link:nth-of-type(4) { top: 22%; z-index: 996; }  /* Gift */

/* --- Love words --- */
#ui .love {
  position: absolute;
  top: 50%;
  left: 50%;
  margin: -175px 0 0 -200px;
  /* per-item delay via CSS variable --i (1..N) */
  --i: 1;
}

/* Make the last item match the others */
#ui .love:last-child .love_word {
  color: #ea80b0;
  font-size: 0.9rem;
  text-shadow: 0 0 10px #fff;
}

#ui .love_word {
  color: #ea80b0;
  font-size: 0.9rem;
  transform: translateY(-100%) rotateZ(-30deg);
  text-shadow: 0 0 10px #fff;
  letter-spacing: 1px;
  white-space: nowrap;
}
#ui .love_horizontal {
  animation: horizontal 10000ms infinite alternate ease-in-out;
  animation-delay: calc(var(--i) * -300ms);
}
#ui .love_vertical {
  animation: vertical 20000ms infinite linear;
  animation-delay: calc(var(--i) * -300ms);
}

/* --- Animations --- */
@keyframes horizontal {
  from { transform: translateX(0px); }
  to   { transform: translateX(350px); }
}
@keyframes vertical {
  0%   { transform: translateY(140px); }
  10%  { transform: translateY(35px); }
  15%  { transform: translateY(3.5px); }
  18%  { transform: translateY(0px); }
  20%  { transform: translateY(3.5px); }
  22%  { transform: translateY(27px); }
  24%  { transform: translateY(50px); }
  25%  { transform: translateY(88px); }
  26%  { transform: translateY(50px); }
  28%  { transform: translateY(27px); }
  30%  { transform: translateY(3.5px); }
  32%  { transform: translateY(0px); }
  35%  { transform: translateY(3.5px); }
  40%  { transform: translateY(35px); }
  50%  { transform: translateY(140px); }
  71%  { transform: translateY(335px); }
  72.5%{ transform: translateY(344px); }
  75%  { transform: translateY(350px); }
  77.5%{ transform: translateY(344px); }
  79%  { transform: translateY(335px); }
  100% { transform: translateY(140px); }
}

  </style>
</head>
<body>
  <!-- Quick links - you can customize these URLs -->
  <a href="#" class="quick-link" title="Create">Create</a>
  <a href="#" class="quick-link" title="More">More</a>
  <a href="#" class="quick-link" title="Source Code">Code</a>
  <a href="#" class="quick-link" title="Gift">Gift</a>

  <div id="ui"></div>

  <script>
    // Create N floating items
    const N = 90;     // adjusted for better heart shape
    const ui = document.getElementById('ui');

    for (let i = 1; i <= N; i++) {
      const love = document.createElement('div');
      love.className = 'love';
      love.style.setProperty('--i', i);

      const h = document.createElement('div');
      h.className = 'love_horizontal';

      const v = document.createElement('div');
      v.className = 'love_vertical';

      const word = document.createElement('div');
      word.className = 'love_word';
      word.textContent = '-MIND YOUR BUSINESS ASIDII';

      v.appendChild(word);
      h.appendChild(v);
      love.appendChild(h);
      ui.appendChild(love);
    }
  </script>

</body>
</html>
